services:

  postgres:
    image: postgres:15-alpine
    container_name: apptrackr-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: apptrackr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apptrackr-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: apptrackr-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

   
  backend:
    build: ./apptrackr-backend
    container_name: apptrackr-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:yourpassword@postgres:5432/apptrackr
      MONGO_URI: mongodb://mongo:27017/apptrackr
      JWT_SECRET: your_super_secret_key_change_this
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: another_secret_for_refresh
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  frontend:
    build: ./apptrackr-frontend
    container_name: apptrackr-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
